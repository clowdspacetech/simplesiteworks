<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2400 1200" fill="none" role="img" aria-label="SimpleSiteWorks">
  <defs>
    <linearGradient id="ssw-brand-gradient" x1="1200" y1="0" x2="1200" y2="1200" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00D2FF"/>
      <stop offset="38%" stop-color="#2B7BFF"/>
      <stop offset="72%" stop-color="#5B3FD6"/>
      <stop offset="100%" stop-color="#8E2DE2"/>
    </linearGradient>
    <linearGradient id="ssw-text-gradient" x1="900" y1="680" x2="1180" y2="680" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00D2FF"/>
      <stop offset="50%" stop-color="#3A7BD5"/>
      <stop offset="100%" stop-color="#8E2DE2"/>
    </linearGradient>
  </defs>

  <!-- Mark (centered above wordmark) -->
  <g transform="translate(1200 340)">
    <path
      d="M 168 42 C 4 -18 -196 22 -276 166 C -316 238 -296 306 -196 342 C -132 366 -52 346 4 302"
      stroke="url(#ssw-brand-gradient)"
      stroke-width="108"
      stroke-linecap="butt"
      stroke-linejoin="round"
      fill="none"
    />
    <path
      d="M -232 730 C -68 790 132 750 212 606 C 252 534 232 466 132 430 C 68 406 -12 426 -68 470"
      stroke="url(#ssw-brand-gradient)"
      stroke-width="108"
      stroke-linecap="butt"
      stroke-linejoin="round"
      fill="none"
    />
  </g>

  <!-- Wordmark -->
  <text
    x="1200"
    y="820"
    text-anchor="middle"
    font-family="'Outfit', 'Segoe UI', system-ui, sans-serif"
    font-size="168"
    font-weight="600"
    letter-spacing="-2"
  >
    <tspan fill="#FFFFFF">Simple</tspan><tspan fill="url(#ssw-text-gradient)">Site</tspan><tspan fill="#FFFFFF">Works</tspan>
  </text>

  <!-- Tagline -->
  <text
    x="1200"
    y="920"
    text-anchor="middle"
    font-family="'Inter', 'Segoe UI', system-ui, sans-serif"
    font-size="44"
    font-weight="500"
    letter-spacing="12"
    fill="#9CA3AF"
  >
    WEBSITES<tspan fill="url(#ssw-text-gradient)"> " </tspan>APPS<tspan fill="url(#ssw-text-gradient)"> " </tspan>MADE SIMPLE
  </text>
</svg>
